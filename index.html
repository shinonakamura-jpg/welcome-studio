<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoshi Studio — Welcome Message Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110d;
    --surface: #1c1814;
    --surface-2: #252019;
    --surface-3: #2f2920;
    --text: #efe6d4;
    --text-dim: #a89c87;
    --text-faint: #6b6354;
    --border: #3d3528;
    --border-light: #4a4232;
    --accent: #d4a574;
    --accent-hot: #e8b988;
    --accent-cool: #7aa7c7;
    --success: #8db580;
    --danger: #cc6b5e;
    --magic: #b888c7;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  body { background-image: radial-gradient(ellipse at top left, rgba(212,165,116,0.07), transparent 50%), radial-gradient(ellipse at bottom right, rgba(184,136,199,0.05), transparent 50%); background-attachment: fixed; padding: 24px 16px 100px; }
  .container { max-width: 1500px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; padding: 20px 0; }
  header h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; font-size: clamp(2rem, 5vw, 3.4rem); color: var(--accent); letter-spacing: -0.02em; line-height: 1; margin-bottom: 8px; }
  header p { color: var(--text-dim); font-size: 0.92rem; letter-spacing: 0.04em; font-family: 'JetBrains Mono', monospace; }

  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 0 0; border-bottom: none; padding: 8px 8px 0; overflow-x: auto; }
  .tab { background: transparent; border: none; color: var(--text-dim); padding: 10px 16px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.15s ease; border-bottom: 2px solid transparent; position: relative; top: 1px; }
  .tab.active { background: var(--surface-2); color: var(--accent); border-bottom-color: var(--accent); }

  .toolbar { background: var(--surface-2); border: 1px solid var(--border); border-top: none; border-radius: 0 0 14px 14px; padding: 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  button.tool, select.tool, label.tool { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 13px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button.tool:hover { border-color: var(--accent); color: var(--accent-hot); }

  .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }

  .pane { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-height: 480px; }
  .pane-header { padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); display: flex; justify-content: space-between; align-items: center; }
  #editor { flex: 1; background: transparent; border: none; color: var(--text); font-family: 'JetBrains Mono', monospace; padding: 18px; resize: none; width: 100%; outline: none; }
  
  #preview { flex: 1; padding: 18px; overflow-y: auto; color: var(--text); transition: all 0.3s ease; }
  #preview.mobile { max-width: 375px; margin: 0 auto; border-left: 1px dashed var(--border); border-right: 1px dashed var(--border); }
  #preview.light-mode { background: #faf6ee; color: #2a2418; }

  .action-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
  .stats { display: flex; gap: 24px; }
  .stat-value { font-size: 1.2rem; font-weight: 600; color: var(--text); }
  .btn-primary { background: var(--accent); color: var(--bg); padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
  .btn-minify { background: var(--magic); color: white; padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Hoshi Studio <span style="color:var(--text-faint)">◆</span> Welcome Message</h1>
    <p>HTML & CSS Optimized Creator</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="style">Styl</button>
    <button class="tab" data-tab="animate">Animacja</button>
    <button class="tab" data-tab="insert">Wstaw</button>
  </div>

  <div class="toolbar">
    <div class="tab-panel active" data-panel="style">
      <button class="tool" onclick="wrap('<b>','</b>')"><b>B</b> Pogrubienie</button>
      <button class="tool" onclick="wrap('<i>','</i>')"><i>I</i> Kursywa</button>
      <button class="tool" onclick="wrap('<small>','</small>')">Mały</button>
      <button class="tool" onclick="wrap('<div style=\'text-align:center\'>','</div>')">Środek</button>
    </div>
    <div class="tab-panel" data-panel="animate">
      <button class="tool" onclick="smartAnim('shake')">Wstrząs</button>
      <button class="tool" onclick="smartAnim('glow')">Blask</button>
      <button class="tool" onclick="smartAnim('pulse')">Puls</button>
      <button class="tool" onclick="smartAnim('rainbow')">Tęcza</button>
    </div>
    <div class="tab-panel" data-panel="insert">
      <button class="tool" onclick="insertAtCursor('<br>')">Przerwa</button>
      <button class="tool" onclick="insertAtCursor('<hr style=\'border:none;border-top:1px solid #d4a574;margin:12px 0;\'>')">Linia</button>
    </div>
  </div>

  <div class="workspace">
    <div class="pane">
      <div class="pane-header"><span style="font-size:0.7rem; color:var(--text-dim)">EDYTOR HTML</span></div>
      <textarea id="editor" placeholder="Wpisz treść..."></textarea>
    </div>
    <div class="pane">
      <div class="pane-header">
        <span style="font-size:0.7rem; color:var(--text-dim)">PODGLĄD LIVE</span>
        <div>
          <button onclick="toggleMobile()" style="font-size:0.7rem; cursor:pointer; background:none; border:1px solid var(--border); color:var(--text); padding:2px 6px; border-radius:4px;">Mobile View</button>
          <button onclick="toggleTheme()" style="font-size:0.7rem; cursor:pointer; background:none; border:1px solid var(--border); color:var(--text); padding:2px 6px; border-radius:4px; margin-left:4px;">Theme</button>
        </div>
      </div>
      <div id="preview"></div>
    </div>
  </div>

  <div class="action-bar">
    <div class="stats">
      <div class="stat"><span class="stat-value" id="charCount">0</span> / 5750 znaków</div>
    </div>
    <div class="actions">
      <button class="btn-minify" onclick="minifyCode()">Minifikuj Kod</button>
      <button class="btn-primary" onclick="copyToClipboard()">Kopiuj HTML</button>
    </div>
  </div>
</div>

<script>
  const MAX_CHARS = 5750;
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const charCount = document.getElementById('charCount');

  const ANIM_DEFINITIONS = {
    shake: `@keyframes wm-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}`,
    glow: `@keyframes wm-glow{0%,100%{text-shadow:0 0 8px #d4a574}50%{text-shadow:0 0 18px #d4a574}}`,
    pulse: `@keyframes wm-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}`,
    rainbow: `@keyframes wm-rainbow{0%{color:#ff6b6b}33%{color:#48dbfb}66%{color:#1dd1a1}100%{color:#ff6b6b}}`
  };

  function update() {
    const val = editor.value;
    preview.innerHTML = val;
    charCount.textContent = val.length;
    charCount.style.color = val.length > MAX_CHARS ? '#cc6b5e' : '#efe6d4';
  }

  editor.addEventListener('input', update);

  function wrap(before, after) {
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const selected = editor.value.substring(start, end);
    const content = before + selected + after;
    editor.setRangeText(content, start, end, 'select');
    update();
  }

  function insertAtCursor(text) {
    const start = editor.selectionStart;
    editor.setRangeText(text, start, start, 'end');
    update();
  }

  function smartAnim(name) {
    const keyframe = ANIM_DEFINITIONS[name];
    let content = editor.value;
    let styleBlock = '';
    
    if (!content.includes(keyframe)) {
      styleBlock = `<style>${keyframe}</style>\n`;
    }

    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const selected = editor.value.substring(start, end) || "tekst";
    
    const span = `<span style="display:inline-block;animation:wm-${name} 1.5s infinite">${selected}</span>`;
    
    editor.setRangeText(styleBlock + span, start, end, 'select');
    update();
  }

  function minifyCode() {
    let code = editor.value;
    code = code.replace(/\n/g, '').replace(/ {2,}/g, ' ').replace(/> </g, '><');
    editor.value = code;
    update();
  }

  function toggleMobile() { preview.classList.toggle('mobile'); }
  function toggleTheme() { preview.classList.toggle('light-mode'); }

  function copyToClipboard() {
    navigator.clipboard.writeText(editor.value).then(() => alert("Skopiowano!"));
  }

  // Tabs logic
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab, .tab-panel').forEach(el => el.classList.remove('active'));
      tab.classList.add('active');
      document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    });
  });
</script>
</body>
</html>
